<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script type="importmap">{"imports":{"@/":"/src/"}}</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#242731;font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#stage{position:absolute;inset:0;overflow:hidden;z-index:1}
.bank{position:absolute;inset:0;visibility:hidden}
.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.actor{position:absolute;top:0;bottom:0}
canvas{width:100%;height:100%;display:block}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:48px}
#sub{position:absolute;z-index:20;bottom:30px;left:8%;width:84%;padding:15px 36px;border-radius:22px;text-align:center;font-weight:bold;font-size:48px;line-height:1.35;overflow-wrap:anywhere;color:white;-webkit-text-stroke:1px black;paint-order:stroke fill;text-shadow:0 1px 2px black}
</style>
</head>
<body>
<div id="stage"></div><div id="sub"></div>
<script type="module">
import {StandEngine} from '/src/components/conversations/stand/StandEngine';
import {loadSpineRuntime} from '/src/components/conversations/stand/spineRuntime';
import {performancePose} from '/src/components/kaibun/performance';
const stage=document.querySelector('#stage'),sub=document.querySelector('#sub');
const painted=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
let failure=null,active=null;
let referenceHeight=0;
const banks=[],slots=[],layouts=new Map();
function healthy(){
 if(failure)throw Error(failure);
 for(const slot of slots)if(slot.engine&&slot.gl.isContextLost())throw Error('Export WebGL context was lost');
}
function bankAt(index){
 if(banks[index])return banks[index];
 const node=document.createElement('div'),bg=new Image();
 node.className='bank';bg.className='background';bg.hidden=true;node.append(bg);stage.append(node);
 const bank={node,bg,background:'',slots:[],key:null,visible:[]};banks.push(bank);return bank;
}
function slotAt(bank,index){

 const node=document.createElement('div'),canvas=document.createElement('canvas'),label=document.createElement('div');
 node.className='actor';label.className='fallback';node.append(canvas,label);bank.node.append(node);
 canvas.addEventListener('webglcontextlost',()=>{failure='Export WebGL context was lost';});
 const slot={node,canvas,label,engine:null,gl:null,outfit:null,actor:null};slots.push(slot);return slot;
}
function shotKey(item){return JSON.stringify([item.background||'',item.actors.map(a=>[a.id,a.outfit||null,a.height||1000,a.name||''])]);}
function subtitleLayout(text){
 if(layouts.has(text))return layouts.get(text);
 const measure=sub.cloneNode(false);measure.removeAttribute('id');const computed=getComputedStyle(sub);
 for(const key of ['fontFamily','fontWeight','padding','boxSizing','textAlign','wordBreak','overflowWrap'])measure.style[key]=computed[key];
 Object.assign(measure.style,{position:'fixed',visibility:'hidden',pointerEvents:'none',width:sub.getBoundingClientRect().width+'px',height:'auto',minHeight:'0',lineHeight:'1.35'});
 document.body.append(measure);
 const maxHeight=text.length<=240?183:Math.max(183,innerHeight*.32);let layout;
 for(let size=48;size>=14;size--){
  measure.style.fontSize=size+'px';measure.textContent=text;const height=measure.getBoundingClientRect().height;
  if(height<=maxHeight||size===14){layout={fontSize:size+'px',minHeight:Math.ceil(height)+'px'};break;}
 }
 measure.remove();layouts.set(text,layout);return layout;
}
function directionFor(item,actor,index=0){
 const base=actor;
 const line={...item.line,performance_segments:item.segments||[]};
 const pose=performancePose(line,item.segments?.[index],actor.id,base);
 return {...pose,speaking:actor.speaking,looking:true,nod:null};
}

function direct(bank,item){
 for(const actor of item.actors){
  const slot=bank.slots.find(s=>s.actor===actor.id);
  slot.node.style.opacity=actor.isSpeaker?'1':'0.85';slot.node.style.zIndex=actor.isSpeaker?'10':String(item.actors.indexOf(actor));
  slot.engine?.direct(directionFor(item,actor),false);
 }
}
async function prepareShot(item){
 healthy();if(item.actors.length>7)throw Error('Export shot exceeds seven actors');
 const key=shotKey(item);
 if(active?.key===key)return active; // A subtitle/speaker change must not reload or pause engines.
 const bank=bankAt(active===banks[0]?1:0);

 bank.node.style.visibility='hidden';bank.key=null;
 if(bank.background!==(item.background||'')){
  if(item.background){const image=new Image();image.src=item.background;await image.decode();if(!image.naturalWidth)throw Error('Export background failed to decode');bank.bg.src=item.background;bank.bg.hidden=false;}
  else{bank.bg.hidden=true;bank.bg.removeAttribute('src');}
  bank.background=item.background||'';
 }
 const used=new Set();bank.visible=[];bank.slots=[];
 for(const actor of item.actors){
  // A retained actor keeps the exact live skeleton/track clocks until the atomic commit.
  let slot=active?.slots.find(s=>s.actor===actor.id&&s.outfit===(actor.outfit||null)&&!used.has(s));
  if(slot){used.add(slot);bank.slots.push(slot);bank.visible.push(actor.id);continue;}
  slot=slots.find(s=>!used.has(s)&&!active?.slots.includes(s)&&s.actor===actor.id&&s.outfit===(actor.outfit||null));
  if(!slot)slot=slots.find(s=>!used.has(s)&&!active?.slots.includes(s));
  if(!slot)slot=slotAt(bank,0);
  used.add(slot);bank.slots.push(slot);bank.visible.push(actor.id);slot.actor=actor.id;bank.node.append(slot.node);
  slot.node.style.display='block';slot.node.style.width=innerWidth+'px';
  slot.canvas.style.display=actor.outfit?'block':'none';slot.label.style.display=actor.outfit?'none':'flex';
  if(!actor.outfit){slot.label.textContent=actor.name||actor.id;slot.outfit=null;continue;}
  if(!slot.engine){slot.engine=new StandEngine(slot.canvas,await loadSpineRuntime(),'waist');slot.gl=slot.canvas.getContext('webgl');}
  if(slot.outfit!==actor.outfit){await slot.engine.load({id:actor.outfit,url:'/assets/spine/idols/'+actor.outfit+'/'});slot.outfit=actor.outfit;}
  slot.engine.direct(directionFor(item,actor),false);
  slot.engine.setPaused(false);
 }
 await painted();healthy();
 for(const slot of bank.slots)if(!active?.slots.includes(slot))slot.engine?.setPaused(true);
 bank.key=key;return bank;
}
function commitShot(bank,item){
 healthy();
 if(active!==bank){
  if(active){active.node.style.visibility='hidden';for(const slot of active.slots)if(!bank.slots.includes(slot)){slot.node.style.display='none';slot.engine?.setPaused(true);}}
  for(const slot of bank.slots){bank.node.append(slot.node);slot.node.style.display='block';}
  bank.node.style.visibility='visible';active=bank;
  for(const slot of bank.slots)slot.engine?.setPaused(false);
 }
 const reference=referenceHeight||Math.max(1,...item.actors.filter(a=>a.outfit).map(a=>a.height||1000));
 const ratio=item.actors.length<=3?.74:item.actors.length<=5?.82:.90;
 const height=reference*ratio,bottom=reference*(1.06-ratio);
 for(const [index,actor] of item.actors.entries()){
  const slot=bank.slots.find(s=>s.actor===actor.id);
  slot.node.style.width=innerWidth+'px';slot.node.style.left=((index+.5)*innerWidth/item.actors.length-innerWidth/2)+'px';
  if(slot.engine)slot.engine.groundFrame={height,bottom};
 }
 direct(bank,item);
 Object.assign(sub.style,subtitleLayout(item.zh||''));sub.style.backgroundColor=item.color+'c7';sub.textContent=item.zh||'';
}
window.show=async item=>{const bank=await prepareShot(item);commitShot(bank,item);await painted();healthy();};
window.setSegment=(item,index)=>{
 const segment=item.segments?.[index];if(!segment)return;
 for(const actor of item.actors){
  const state=Object.assign({},...item.segments.slice(0,index+1).map(part=>part.actor_states?.[actor.id]||{}));
  const explicit=Object.keys(state).length>0;if(!explicit&&!actor.isSpeaker)continue;
  const slot=active.slots.find(s=>s.actor===actor.id);
  slot?.engine?.direct(directionFor(item,actor,index),false);
 }
 healthy();
};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,Math.max(0,ms)));
window.playLine=async item=>{
 const started=performance.now(),duration=item.duration*1000,cueDuration=(item.cue_duration||item.duration)*1000;
 const waitUntil=async deadline=>{while(performance.now()-started<deadline){await wait(Math.min(250,deadline-(performance.now()-started)));healthy();}};
 let currentSegment=0;
 const events=(item.segments||[]).slice(1).map((segment,index)=>({index:index+1,at:cueDuration*(segment.start??(index+1)/item.segments.length)}));
 for(const actor of item.actors)if(actor.speaking)events.push({actor,at:actor.voiceDuration*1000});
 for(const event of events.sort((first,second)=>first.at-second.at)){
  await waitUntil(event.at);
  if(event.actor){
   event.actor.speaking=false;
   const slot=active.slots.find(slot=>slot.actor===event.actor.id);
   slot?.engine?.direct(directionFor(item,event.actor,currentSegment),false);
  }else{currentSegment=event.index;window.setSegment(item,currentSegment);}
 }
 await waitUntil(duration);return {started:started/1000,ended:performance.now()/1000};
};
window.prepare=async entries=>{
 referenceHeight=Math.max(1,...entries.flatMap(item=>item.actors.filter(actor=>actor.outfit).map(actor=>actor.height||1000)));
 const resources=new Set();
 for(const item of entries){subtitleLayout(item.zh||'');if(item.background)resources.add(item.background);for(const actor of item.actors)if(actor.outfit)for(const file of ['data.json','data.atlas','data.png'])resources.add('/assets/spine/idols/'+actor.outfit+'/'+file);}
 let next=0;const urls=[...resources];
 await Promise.all(Array.from({length:4},async()=>{while(next<urls.length){const url=urls[next++],response=await fetch(url);if(!response.ok)throw Error('Missing export asset: '+url);await response.arrayBuffer();}}));
 if(entries.length)await window.show(entries[0]);
};
window.installCalibration=()=>{const marker=document.createElement('div');marker.id='export-calibration';marker.style.cssText='position:fixed;inset:0;z-index:99999;background:rgb(255,0,255)';document.body.append(marker);};
window.renderStory=async entries=>{
 let start=null;const offsets=[];
 let pending=entries.length?prepareShot(entries[0]).then(bank=>({bank}),error=>({error})):null;
 for(let i=0;i<entries.length;i++){
  const item=entries[i],prepared=await pending;if(prepared.error)throw prepared.error;
  const transition=({short:400,medium:800,long:1400})[item.transition_length]||400;
  if(i&&item.transition==='pause')await wait(transition);
  if(i&&item.transition==='fade')await document.body.animate([{opacity:1},{opacity:0}],{duration:transition/2,fill:'forwards'}).finished;
  if(start===null)await new Promise(resolve=>requestAnimationFrame(now=>{commitShot(prepared.bank,item);document.querySelector('#export-calibration')?.remove();start=now/1000;resolve();}));
  else commitShot(prepared.bank,item);
  const playback=window.playLine(item);
  if(i&&item.transition==='fade')await document.body.animate([{opacity:0},{opacity:1}],{duration:transition/2,fill:'forwards'}).finished;
  // Give the committed shot a paint before decoding the next shot; keep one audio clock.
  pending=i+1<entries.length?painted().then(()=>prepareShot(entries[i+1])).then(bank=>({bank}),error=>({error})):null;
  const timing=await playback;offsets.push(timing.started-start);
  console.log(JSON.stringify({progress:i+1}));healthy();
 }
 return {offsets,elapsed:performance.now()/1000-start,renderer_version:28,calibration_marker:true};
};
window.exportState=()=>{healthy();return {contexts:slots.filter(s=>s.engine).length,visible:active?.visible||[],background:active?.background||'',backgroundReady:!active?.background||(active.bg.complete&&active.bg.naturalWidth>0),subtitle:sub.textContent};};
window.ready=true;

</script>
</body>
</html>
